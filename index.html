<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Unterrichtsverwaltung</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #22223b;
    --accent: #e8c547;
    --accent2: #f4a261;
    --text: #f0ede8;
    --text-muted: #8a8a9a;
    --green: #52b788;
    --red: #e63946;
    --orange: #f4a261;
    --border: rgba(255,255,255,0.08);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .header-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }

  /* NAV */
  .nav {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn {
    flex: 1;
    min-width: 80px;
    padding: 12px 8px;
    border: none;
    background: none;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .nav-btn .nav-icon { font-size: 1.1rem; display: block; margin-bottom: 2px; }

  /* PAGES */
  .page { display: none; padding: 20px; animation: fadeIn 0.25s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .card-title { font-family: 'DM Serif Display', serif; font-size: 1rem; }
  .card-subtitle { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

  /* SECTION TITLE */
  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    color: var(--accent);
    margin-bottom: 16px;
  }

  /* FORM */
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }

  select.form-input option { background: var(--surface2); }

  /* BUTTONS */
  .btn {
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--accent); color: #0f0f1a; }
  .btn-primary:active { transform: scale(0.97); }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: rgba(230,57,70,0.15); color: var(--red); border: 1px solid rgba(230,57,70,0.3); }
  .btn-full { width: 100%; justify-content: center; }
  .btn-sm { padding: 7px 12px; font-size: 0.78rem; }

  /* BADGE */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .badge-45 { background: rgba(232,197,71,0.15); color: var(--accent); }
  .badge-30 { background: rgba(244,162,97,0.15); color: var(--accent2); }

  /* STUDENT LIST */
  .student-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .student-item:active { border-color: var(--accent); }
  .student-avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Serif Display', serif;
    font-size: 1rem;
    color: #0f0f1a;
    font-weight: bold;
    flex-shrink: 0;
  }
  .student-info { flex: 1; margin-left: 12px; }
  .student-name { font-weight: 600; font-size: 0.95rem; }
  .student-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .student-actions { display: flex; gap: 6px; }

  /* ATTENDANCE */
  .att-btn {
    flex: 1;
    padding: 14px 8px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--surface2);
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .att-btn .att-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
  .att-btn.selected-present { border-color: var(--green); background: rgba(82,183,136,0.12); color: var(--green); }
  .att-btn.selected-excused { border-color: var(--accent); background: rgba(232,197,71,0.12); color: var(--accent); }
  .att-btn.selected-absent { border-color: var(--red); background: rgba(230,57,70,0.12); color: var(--red); }

  .att-date-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .att-date-nav {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 500;
  }
  .att-date-display {
    font-family: 'DM Serif Display', serif;
    font-size: 1rem;
    color: var(--accent);
    text-align: center;
  }

  .att-student-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
  }
  .att-student-name { font-weight: 600; margin-bottom: 10px; }
  .att-buttons { display: flex; gap: 8px; }

  /* MONATSABRECHNUNG */
  .month-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .month-row:last-child { border-bottom: none; }
  .month-student { font-weight: 500; }
  .month-detail { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .month-amount { font-family: 'DM Serif Display', serif; font-size: 1.1rem; }
  .amount-green { color: var(--green); }
  .amount-red { color: var(--red); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: var(--accent); margin-bottom: 20px; }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
  .empty-text { font-size: 0.85rem; }

  /* MONTH PICKER */
  .month-picker { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 20px; }
  .month-picker select.form-input { text-align: center; }

  /* HISTORY DOTS */
  .history-dots { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-present { background: var(--green); }
  .dot-excused { background: var(--accent); }
  .dot-absent { background: var(--red); }

  /* CHIP */
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 10px; font-size: 0.75rem;
  }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  .text-muted { color: var(--text-muted); font-size: 0.82rem; }
  .text-right { text-align: right; }
  .mt-8 { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }
  .flex-end { display: flex; gap: 8px; justify-content: flex-end; }

  /* PROFIT HIGHLIGHT */
  .profit-box {
    background: linear-gradient(135deg, rgba(82,183,136,0.1), rgba(82,183,136,0.05));
    border: 1px solid rgba(82,183,136,0.3);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    margin-top: 16px;
  }
  .profit-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
  .profit-value { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--green); margin-top: 4px; }

  /* LISTE */
  .pdf-preview { width: 100%; height: 70vh; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; margin-top: 16px; }
  @media (max-width: 700px) { .pdf-preview { display: none; } }
  .liste-hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 12px; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">Unterricht</div>
    <div class="header-sub">Schülerverwaltung</div>
  </div>
  <div id="headerDate" style="font-size:0.75rem;color:var(--text-muted);text-align:right;"></div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="showPage('schueler')">
    <span class="nav-icon">👤</span>Schüler
  </button>
  <button class="nav-btn" onclick="showPage('anwesenheit')">
    <span class="nav-icon">📋</span>Anwesenheit
  </button>
  <button class="nav-btn" onclick="showPage('abrechnung')">
    <span class="nav-icon">💶</span>Abrechnung
  </button>
  <button class="nav-btn" onclick="showPage('liste')">
    <span class="nav-icon">📄</span>Liste
  </button>
</div>

<!-- ==================== SCHÜLER ==================== -->
<div class="page active" id="page-schueler">
  <div class="section-title">Schüler</div>
  <button class="btn btn-primary btn-full" onclick="openAddStudent()">+ Neuen Schüler hinzufügen</button>
  <div class="mt-16" id="studentList"></div>
</div>

<!-- ==================== ANWESENHEIT ==================== -->
<div class="page" id="page-anwesenheit">
  <div class="section-title">Anwesenheit</div>
  <div class="att-date-row">
    <button class="att-date-nav" onclick="changeDate(-1)">◀</button>
    <div>
      <div class="att-date-display" id="attDateDisplay"></div>
      <div style="font-size:0.7rem;color:var(--text-muted);text-align:center;" id="attWeekday"></div>
    </div>
    <button class="att-date-nav" onclick="changeDate(1)">▶</button>
  </div>
  <div id="attStudentList"></div>
</div>

<!-- ==================== ABRECHNUNG ==================== -->
<div class="page" id="page-abrechnung">
  <div class="section-title">Monatsabrechnung</div>
  <div class="month-picker">
    <select class="form-input" id="billMonth" onchange="renderBilling()" style="max-width:140px;">
    </select>
    <select class="form-input" id="billYear" onchange="renderBilling()" style="max-width:100px;">
    </select>
  </div>
  <div id="billingContent"></div>
</div>

<!-- ==================== LISTE (PDF) ==================== -->
<div class="page" id="page-liste">
  <div class="section-title">Nutzungsdauer &amp; Anwesenheit</div>
  <div class="form-group">
    <label class="form-label">Mieter/Mieterin</label>
    <input class="form-input" id="l_mieter" placeholder="Nachname, Vorname" onchange="saveSettings();renderListe()">
  </div>
  <div class="month-picker">
    <select class="form-input" id="listMonth" onchange="renderListe()" style="max-width:140px;"></select>
    <select class="form-input" id="listYear" onchange="renderListe()" style="max-width:100px;"></select>
  </div>
  <div class="flex-end" style="justify-content:center;flex-wrap:wrap;">
    <button class="btn btn-primary" onclick="openListePdf()">📄 PDF öffnen / drucken</button>
    <button class="btn btn-ghost" onclick="downloadListePdf()">⬇ Herunterladen</button>
  </div>
  <div class="liste-hint" id="listeHint"></div>
  <iframe class="pdf-preview" id="listePreview" title="PDF-Vorschau"></iframe>
</div>

<!-- ==================== MODAL: SCHÜLER HINZUFÜGEN/BEARBEITEN ==================== -->
<div class="modal-overlay" id="studentModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Neuer Schüler</div>

    <div class="form-group">
      <label class="form-label">Vorname *</label>
      <input class="form-input" id="f_vorname" placeholder="z.B. Anna" type="text">
    </div>
    <div class="form-group">
      <label class="form-label">Nachname *</label>
      <input class="form-input" id="f_nachname" placeholder="z.B. Müller" type="text">
    </div>
    <div class="form-group">
      <label class="form-label">Telefon</label>
      <input class="form-input" id="f_telefon" placeholder="+49 ..." type="tel">
    </div>
    <div class="form-group">
      <label class="form-label">E-Mail</label>
      <input class="form-input" id="f_email" placeholder="name@beispiel.de" type="email">
    </div>
    <div class="divider"></div>
    <div style="font-family:'DM Serif Display',serif;font-size:1rem;color:var(--accent);margin-bottom:14px;">Vertragsdaten</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Unterrichtsdauer</label>
        <select class="form-input" id="f_dauer">
          <option value="45">45 Minuten</option>
          <option value="30">30 Minuten</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Stunden/Woche</label>
        <select class="form-input" id="f_stundenProWoche">
          <option value="1">1x pro Woche</option>
          <option value="2">2x pro Woche</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Monatspauschale (€) *</label>
      <input class="form-input" id="f_pauschale" placeholder="z.B. 120" type="number" min="0" step="0.01">
    </div>
    <div class="form-group">
      <label class="form-label">Unterrichtstag(e)</label>
      <input class="form-input" id="f_tag" placeholder="z.B. Montag, Donnerstag">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Uhrzeit (Beginn)</label>
        <input class="form-input" id="f_uhrzeit" type="time">
      </div>
      <div class="form-group">
        <label class="form-label">Unterricht ab</label>
        <input class="form-input" id="f_ab" type="date">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Fach</label>
        <input class="form-input" id="f_fach" placeholder="Gitarre">
      </div>
      <div class="form-group">
        <label class="form-label">Kurs-Nr.</label>
        <input class="form-input" id="f_kurs" placeholder="102">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Geburtsdatum</label>
      <input class="form-input" id="f_geburt" type="date">
    </div>
    <div class="form-group">
      <label class="form-label">Notizen</label>
      <textarea class="form-input" id="f_notizen" placeholder="Besonderheiten..." rows="3" style="resize:none;"></textarea>
    </div>

    <div class="flex-end mt-16">
      <button class="btn btn-ghost" onclick="closeModal('studentModal')">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveStudent()" id="saveStudentBtn">Speichern</button>
    </div>
    <div id="editDeleteRow" style="margin-top:10px;display:none;">
      <button class="btn btn-danger btn-full" onclick="deleteStudent()">Schüler löschen</button>
    </div>
  </div>
</div>

<script>
// ==================== DATA ====================
let students = JSON.parse(localStorage.getItem('uv_students') || '[]');
let attendance = JSON.parse(localStorage.getItem('uv_attendance') || '{}');
// attendance[date][studentId] = 'present' | 'excused' | 'absent'

let editingStudentId = null;
let currentAttDate = new Date();
currentAttDate.setHours(0,0,0,0);

function save() {
  localStorage.setItem('uv_students', JSON.stringify(students));
  localStorage.setItem('uv_attendance', JSON.stringify(attendance));
}

// ==================== NAV ====================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  const idx = ['schueler','anwesenheit','abrechnung','liste'].indexOf(id);
  document.querySelectorAll('.nav-btn')[idx].classList.add('active');
  if(id === 'anwesenheit') renderAttendance();
  if(id === 'abrechnung') renderBilling();
  if(id === 'liste') renderListe();
}

// ==================== HEADER DATE ====================
function updateHeaderDate() {
  const now = new Date();
  document.getElementById('headerDate').textContent =
    now.toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'short', year:'numeric'});
}
updateHeaderDate();

// ==================== STUDENTS ====================
function renderStudents() {
  const list = document.getElementById('studentList');
  if(students.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">👥</div><div class="empty-text">Noch keine Schüler erfasst.<br>Füge deinen ersten Schüler hinzu!</div></div>`;
    return;
  }
  list.innerHTML = students.map(s => {
    const initials = (s.vorname[0]||'') + (s.nachname[0]||'');
    const hist = getStudentHistory(s.id);
    const dots = hist.slice(-10).map(d =>
      `<div class="dot dot-${d}"></div>`
    ).join('');
    return `<div class="student-item" onclick="openEditStudent('${s.id}')">
      <div class="student-avatar">${initials.toUpperCase()}</div>
      <div class="student-info">
        <div class="student-name">${s.vorname} ${s.nachname}</div>
        <div class="student-meta">
          <span class="badge ${s.dauer==45?'badge-45':'badge-30'}">${s.dauer} Min</span>
          &nbsp;${s.tag || '—'} &nbsp;·&nbsp; ${formatEuro(s.pauschale)}/Monat
        </div>
        <div class="history-dots mt-8">${dots}</div>
      </div>
      <div style="color:var(--text-muted);font-size:1.2rem;">›</div>
    </div>`;
  }).join('');
}

function getStudentHistory(id) {
  const result = [];
  Object.keys(attendance).sort().forEach(date => {
    if(attendance[date][id]) result.push(attendance[date][id]);
  });
  return result;
}

function openAddStudent() {
  editingStudentId = null;
  document.getElementById('modalTitle').textContent = 'Neuer Schüler';
  document.getElementById('saveStudentBtn').textContent = 'Speichern';
  document.getElementById('editDeleteRow').style.display = 'none';
  clearForm();
  openModal('studentModal');
}

function openEditStudent(id) {
  editingStudentId = id;
  const s = students.find(x => x.id === id);
  if(!s) return;
  document.getElementById('modalTitle').textContent = s.vorname + ' ' + s.nachname;
  document.getElementById('saveStudentBtn').textContent = 'Aktualisieren';
  document.getElementById('editDeleteRow').style.display = 'block';
  document.getElementById('f_vorname').value = s.vorname || '';
  document.getElementById('f_nachname').value = s.nachname || '';
  document.getElementById('f_telefon').value = s.telefon || '';
  document.getElementById('f_email').value = s.email || '';
  document.getElementById('f_dauer').value = s.dauer || 45;
  document.getElementById('f_stundenProWoche').value = s.stundenProWoche || 1;
  document.getElementById('f_pauschale').value = s.pauschale || '';
  document.getElementById('f_tag').value = s.tag || '';
  document.getElementById('f_notizen').value = s.notizen || '';
  document.getElementById('f_uhrzeit').value = s.uhrzeit || '';
  document.getElementById('f_ab').value = s.ab || '';
  document.getElementById('f_fach').value = s.fach || '';
  document.getElementById('f_kurs').value = s.kurs || '';
  document.getElementById('f_geburt').value = s.geburt || '';
  openModal('studentModal');
}

function clearForm() {
  ['f_vorname','f_nachname','f_telefon','f_email','f_pauschale','f_tag','f_notizen','f_uhrzeit','f_ab','f_fach','f_kurs','f_geburt'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('f_dauer').value = 45;
  document.getElementById('f_stundenProWoche').value = 1;
}

function saveStudent() {
  const vorname = document.getElementById('f_vorname').value.trim();
  const nachname = document.getElementById('f_nachname').value.trim();
  const pauschale = parseFloat(document.getElementById('f_pauschale').value);
  if(!vorname || !nachname) { alert('Vor- und Nachname sind Pflichtfelder.'); return; }
  if(!pauschale || pauschale <= 0) { alert('Bitte gib eine gültige Monatspauschale ein.'); return; }

  const data = {
    vorname, nachname,
    telefon: document.getElementById('f_telefon').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    dauer: parseInt(document.getElementById('f_dauer').value),
    stundenProWoche: parseInt(document.getElementById('f_stundenProWoche').value),
    pauschale,
    tag: document.getElementById('f_tag').value.trim(),
    notizen: document.getElementById('f_notizen').value.trim(),
    uhrzeit: document.getElementById('f_uhrzeit').value,
    ab: document.getElementById('f_ab').value,
    fach: document.getElementById('f_fach').value.trim(),
    kurs: document.getElementById('f_kurs').value.trim(),
    geburt: document.getElementById('f_geburt').value,
  };

  if(editingStudentId) {
    const idx = students.findIndex(s => s.id === editingStudentId);
    students[idx] = { ...students[idx], ...data };
  } else {
    data.id = 'S' + Date.now();
    students.push(data);
  }
  save();
  closeModal('studentModal');
  renderStudents();
}

function deleteStudent() {
  if(!confirm('Schüler wirklich löschen? Alle Anwesenheitsdaten werden ebenfalls gelöscht.')) return;
  students = students.filter(s => s.id !== editingStudentId);
  Object.keys(attendance).forEach(date => {
    delete attendance[date][editingStudentId];
  });
  save();
  closeModal('studentModal');
  renderStudents();
}

// ==================== ATTENDANCE ====================
function pad2(n) { return String(n).padStart(2, '0'); }
function dateKey(d) {
  // lokales Datum (toISOString lieferte in MEZ/MESZ den Vortag)
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

// Einmalige Korrektur alter Datumsschlüssel (waren um einen Tag nach vorne verschoben)
(function migrateDateKeys() {
  try {
    if(localStorage.getItem('uv_datefix1')) return;
    const fixed = {};
    Object.keys(attendance).forEach(k => {
      const d = new Date(k + 'T00:00:00');
      if(d.getTimezoneOffset() < 0) d.setDate(d.getDate() + 1);
      const nk = dateKey(d);
      fixed[nk] = Object.assign(fixed[nk] || {}, attendance[k]);
    });
    attendance = fixed;
    save();
    localStorage.setItem('uv_datefix1', '1');
  } catch(e) { console.error(e); }
})();

function changeDate(dir) {
  currentAttDate.setDate(currentAttDate.getDate() + dir);
  renderAttendance();
}

function renderAttendance() {
  const dk = dateKey(currentAttDate);
  if(!attendance[dk]) attendance[dk] = {};

  document.getElementById('attDateDisplay').textContent =
    currentAttDate.toLocaleDateString('de-DE', {day:'2-digit', month:'long', year:'numeric'});
  document.getElementById('attWeekday').textContent =
    currentAttDate.toLocaleDateString('de-DE', {weekday:'long'});

  const list = document.getElementById('attStudentList');
  if(students.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Keine Schüler vorhanden.<br>Füge zuerst Schüler hinzu.</div></div>`;
    return;
  }
  list.innerHTML = students.map(s => {
    const cur = attendance[dk][s.id] || '';
    return `<div class="att-student-row">
      <div class="att-student-name">${s.vorname} ${s.nachname} <span class="badge ${s.dauer==45?'badge-45':'badge-30'}" style="margin-left:6px;">${s.dauer} Min</span></div>
      <div class="att-buttons">
        <button class="att-btn ${cur==='present'?'selected-present':''}" onclick="setAtt('${dk}','${s.id}','present')">
          <span class="att-icon">✅</span>Anwesend
        </button>
        <button class="att-btn ${cur==='excused'?'selected-excused':''}" onclick="setAtt('${dk}','${s.id}','excused')">
          <span class="att-icon">📝</span>Entschuldigt
        </button>
        <button class="att-btn ${cur==='absent'?'selected-absent':''}" onclick="setAtt('${dk}','${s.id}','absent')">
          <span class="att-icon">❌</span>Gefehlt
        </button>
      </div>
    </div>`;
  }).join('');
}

function setAtt(date, studentId, status) {
  if(!attendance[date]) attendance[date] = {};
  if(attendance[date][studentId] === status) {
    delete attendance[date][studentId];
  } else {
    attendance[date][studentId] = status;
  }
  save();
  renderAttendance();
}

// ==================== BILLING ====================
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function initBillingPickers() {
  const mSel = document.getElementById('billMonth');
  const ySel = document.getElementById('billYear');
  mSel.innerHTML = MONTHS.map((m,i) => `<option value="${i}">${m}</option>`).join('');
  const now = new Date();
  mSel.value = now.getMonth();
  const years = [];
  for(let y = now.getFullYear()-2; y <= now.getFullYear(); y++) years.push(y);
  ySel.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
  ySel.value = now.getFullYear();
}

function getDaysInMonth(year, month) {
  const days = [];
  const d = new Date(year, month, 1);
  while(d.getMonth() === month) {
    days.push(dateKey(new Date(d)));
    d.setDate(d.getDate() + 1);
  }
  return days;
}

function renderBilling() {
  const month = parseInt(document.getElementById('billMonth').value);
  const year = parseInt(document.getElementById('billYear').value);
  const days = getDaysInMonth(year, month);
  const isJanuary = (month === 0);

  // Feste Sätze (Maximalbeträge bei 4 Einheiten)
  const EINNAHME_45    = 144.00;
  const EINNAHME_30    = 104.73;
  const AUSGABE_MAX_45 = 84.00;
  const AUSGABE_MAX_30 = 64.00;
  const EINHEIT_45     = AUSGABE_MAX_45 / 4;  // 21,00 € pro Einheit
  const EINHEIT_30     = AUSGABE_MAX_30 / 4;  // 16,00 € pro Einheit

  let totalEinnahmen = 0;
  let totalAusgaben  = 0;

  const rows = students.map(s => {
    const presentCount = days.filter(d => attendance[d] && attendance[d][s.id] === 'present').length;
    const excusedCount = days.filter(d => attendance[d] && attendance[d][s.id] === 'excused').length;
    const absentCount  = days.filter(d => attendance[d] && attendance[d][s.id] === 'absent').length;

    // Einnahmen: nur Feb–Dez (nicht Januar)
    const einnahme = isJanuary ? 0 : (s.dauer == 45 ? EINNAHME_45 : EINNAHME_30);

    // Ausgaben: pro Anwesenheit, max 4 Einheiten (= Maximalbetrag)
    const abrechenbareEinheiten = Math.min(presentCount, 4);
    const einheitSatz = s.dauer == 45 ? EINHEIT_45 : EINHEIT_30;
    const ausgabe = abrechenbareEinheiten * einheitSatz;

    const gewinn = einnahme - ausgabe;

    totalEinnahmen += einnahme;
    totalAusgaben  += ausgabe;

    return `<div class="month-row">
      <div>
        <div class="month-student">${s.vorname} ${s.nachname}
          <span class="badge ${s.dauer==45?'badge-45':'badge-30'}" style="margin-left:6px;">${s.dauer} Min</span>
        </div>
        <div class="month-detail">
          ✅ ${presentCount} anwesend &nbsp; 📝 ${excusedCount} entsch. &nbsp; ❌ ${absentCount} gefehlt
        </div>
        <div class="month-detail" style="margin-top:4px;">
          ${!isJanuary ? `Einnahmen: <span style="color:var(--green)">${formatEuro(einnahme)}</span> &nbsp;·&nbsp; ` : ''}
          Ausgaben: <span style="color:var(--red)">${formatEuro(ausgabe)}</span>
          <span style="color:var(--text-muted);">(${abrechenbareEinheiten}/4 Einh. × ${formatEuro(einheitSatz)})</span>
        </div>
      </div>
      <div class="month-amount ${gewinn >= 0 ? 'amount-green' : 'amount-red'}">${formatEuro(gewinn)}</div>
    </div>`;
  }).join('');

  const totalGewinn = totalEinnahmen - totalAusgaben;

  const content = document.getElementById('billingContent');
  if(students.length === 0) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">💶</div><div class="empty-text">Keine Schüler vorhanden.</div></div>`;
    return;
  }

  content.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${MONTHS[month]} ${year}${isJanuary ? ' <span style="font-size:0.75rem;color:var(--text-muted)">(kein Einnahmenmonat)</span>' : ''}</div>
          <div class="card-subtitle">${students.length} Schüler</div>
        </div>
      </div>
      ${rows}
      <div class="divider"></div>
      <div class="month-row">
        <div>
          <strong>Gesamt</strong>
          <div class="month-detail">
            ${!isJanuary ? `Einnahmen: ${formatEuro(totalEinnahmen)} &nbsp;·&nbsp; ` : ''}Ausgaben: ${formatEuro(totalAusgaben)}
          </div>
        </div>
        <div class="month-amount ${totalGewinn >= 0 ? 'amount-green' : 'amount-red'}"><strong>${formatEuro(totalGewinn)}</strong></div>
      </div>
    </div>
    <div class="profit-box">
      <div class="profit-label">Gewinn ${MONTHS[month]} ${year}</div>
      <div class="profit-value" style="color:${totalGewinn >= 0 ? 'var(--green)' : 'var(--red)'}">${formatEuro(totalGewinn)}</div>
      ${!isJanuary ? `<div class="text-muted mt-8">Einnahmen: ${formatEuro(totalEinnahmen)} · Ausgaben: ${formatEuro(totalAusgaben)}</div>` : `<div class="text-muted mt-8">Nur Ausgaben bei Anwesenheit</div>`}
    </div>`;
}

// ==================== LISTE / PDF ====================
let settings = JSON.parse(localStorage.getItem('uv_settings') || '{}');
function saveSettings() {
  settings.mieter = document.getElementById('l_mieter').value.trim();
  localStorage.setItem('uv_settings', JSON.stringify(settings));
}

const WD = [['montag','MO'],['dienstag','DI'],['mittwoch','MI'],['donnerstag','DO'],['freitag','FR'],['samstag','SA'],['sonntag','SO']];
function weekdayInfo(tag) {
  const t = (tag || '').toLowerCase();
  let best = null;
  WD.forEach(([name, abbr], i) => {
    const pos = t.indexOf(name);
    const pos2 = t.search(new RegExp('\\b' + abbr.toLowerCase() + '\\b'));
    const p = pos >= 0 ? pos : pos2;
    if(p >= 0 && (!best || p < best.pos)) best = { pos: p, idx: i, abbr };
  });
  return best ? best : { idx: 9, abbr: '' };
}
function addMinutes(hhmm, min) {
  if(!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  const t = h * 60 + m + Number(min || 0);
  return pad2(Math.floor(t / 60) % 24) + ':' + pad2(t % 60);
}
function fmtShort(iso) { // 2026-09-22 -> 22.09.26
  if(!iso) return '';
  const [y, m, d] = iso.split('-');
  return d + '.' + m + '.' + y.slice(2);
}

function initListePickers() {
  const mSel = document.getElementById('listMonth');
  const ySel = document.getElementById('listYear');
  mSel.innerHTML = MONTHS.map((m,i) => `<option value="${i}">${m}</option>`).join('');
  const now = new Date();
  mSel.value = now.getMonth();
  const years = [];
  for(let y = now.getFullYear()-2; y <= now.getFullYear()+1; y++) years.push(y);
  ySel.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
  ySel.value = now.getFullYear();
  document.getElementById('l_mieter').value = settings.mieter || '';
}

let listeUrl = null;
function buildListePdf() {
  const month = parseInt(document.getElementById('listMonth').value);
  const year = parseInt(document.getElementById('listYear').value);
  const days = getDaysInMonth(year, month);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const L = 15, R = 195;
  const BOX_X = 96, BOX_W = 13, BOX_GAP = 1.3;
  const boxX = i => BOX_X + i * (BOX_W + BOX_GAP);
  const zeitraum = year + '-' + pad2(month + 1);
  let page = 1;

  const sorted = students.slice().sort((a, b) => {
    const wa = weekdayInfo(a.tag).idx, wb = weekdayInfo(b.tag).idx;
    if(wa !== wb) return wa - wb;
    return (a.uhrzeit || '99:99').localeCompare(b.uhrzeit || '99:99');
  });

  function header() {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
    doc.text('Nutzungsdauer und Anwesenheit', L, 30);
    doc.setLineWidth(0.8); doc.line(L, 36, R, 36);
    doc.setFontSize(9);
    doc.text('Mieter/Mieterin :', L, 46);
    doc.text(settings.mieter || '', L + 28, 46);
    doc.text('Zeitraum :', L, 52);
    doc.text(zeitraum, L + 28, 52);
    doc.text('Kurs', L, 58);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    doc.text('Vorgezogen', boxX(5), 51);
    doc.text('nachgeholt', boxX(5), 55);
    doc.setLineWidth(0.5); doc.line(L, 61, R, 61);
    return 61;
  }
  function footer() {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
    doc.text('Seite : ' + page, R, 288, { align: 'right' });
  }
  function segBox(x, y, letters, mark) {
    // Kästchen mit drei Feldern, z.B. A|E|U; mark = Index des markierten Feldes
    doc.setLineWidth(0.25); doc.rect(x, y, BOX_W, 4.5);
    const w = BOX_W / 3;
    doc.setFontSize(7.5); doc.setFont('helvetica', 'normal');
    letters.forEach((ch, i) => {
      const cx = x + w * i + w / 2;
      if(i > 0) doc.line(x + w * i, y + 0.8, x + w * i, y + 3.7);
      if(mark === i) {
        doc.setFillColor(0, 0, 0); doc.circle(cx, y + 2.25, 1.6, 'F');
        doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold');
        doc.text(ch, cx, y + 3.3, { align: 'center' });
        doc.setTextColor(0, 0, 0); doc.setFont('helvetica', 'normal');
      } else {
        doc.text(ch, cx, y + 3.3, { align: 'center' });
      }
    });
  }

  let y = header();
  const BLOCK_H = 30;
  let summary = [];

  sorted.forEach(s => {
    if(y + BLOCK_H > 280) { footer(); doc.addPage(); page++; y = header(); }
    const wd = weekdayInfo(s.tag).abbr;
    const dauer = Number(s.dauer) || 45;
    const einheiten = Math.round(dauer / 15);
    const entries = days
      .filter(d => attendance[d] && attendance[d][s.id])
      .map(d => ({ d, st: attendance[d][s.id] }));
    // Anwesend + entschuldigt zählen als genutzt
    const genutzt = entries.filter(e => e.st === 'present' || e.st === 'excused').length;
    const nutzung = genutzt * einheiten;
    summary.push({ name: s.nachname + ', ' + s.vorname, termine: entries.length, nutzung });

    // Zeile 1: Kurs / EU / Datum
    let r1 = y + 6;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.text(((s.kurs || '102') + '  ' + (s.fach || 'Gitarre')), L, r1);
    doc.text('EU ' + dauer, 66, r1);
    doc.text('Datum', BOX_X - 1.5, r1, { align: 'right' });
    for(let i = 0; i < 6; i++) {
      doc.setLineWidth(0.25); doc.rect(boxX(i), y + 1.5, BOX_W, 5.5);
      const e = i < 5 ? entries[i] : null;
      let label = '';
      if(e) label = e.d.slice(8, 10) + '.' + e.d.slice(5, 7) + '.';
      if(i === 5 && entries.length > 5) label = entries.slice(5).map(x => x.d.slice(8, 10) + '.').join(' ');
      if(label) { doc.setFontSize(8); doc.text(label, boxX(i) + BOX_W / 2, y + 5.3, { align: 'center' }); }
    }

    // Zeile 2: Tag / Zeit / Einheiten / D|A|V
    let r2 = y + 11.5;
    doc.setFontSize(8.5);
    doc.text(wd, L + 2, r2);
    const zeit = s.uhrzeit ? (s.uhrzeit + '  ' + addMinutes(s.uhrzeit, dauer)) : '';
    doc.text((zeit ? zeit + '   ' : '') + dauer + ' Minuten', L + 12, r2);
    doc.text(einheiten + ' Einheiten', 66, r2);
    // D|A|V: bei jedem erfassten Termin 'Durchgeführt' markieren
    for(let i = 0; i < 5; i++) segBox(boxX(i), y + 8.3, ['D','A','V'], entries[i] ? 0 : -1);
    doc.setLineWidth(0.25); doc.rect(boxX(5), y + 8.3, BOX_W, 4.5);
    doc.setLineWidth(0.2); doc.line(L, y + 14, R, y + 14);

    // Zeile 3: Name / Telefon / ab / A|E|U / Geburtsdatum
    let r3 = y + 18.3;
    doc.setFontSize(8.5);
    doc.text((s.nachname + ', ' + s.vorname).slice(0, 22), L, r3);
    doc.setFontSize(7.5);
    doc.text((s.telefon || '').replace(/\s|\//g, ''), 47, r3);
    if(s.ab) doc.text('ab ' + fmtShort(s.ab), 72, r3);
    for(let i = 0; i < 6; i++) {
      const e = i < 5 ? entries[i] : entries[5];
      const mark = e ? { present: 0, excused: 1, absent: 2 }[e.st] : -1;
      segBox(boxX(i), y + 15.2, ['A','E','U'], mark);
    }
    if(s.geburt) { doc.setFontSize(7.5); doc.text(fmtShort(s.geburt), R, r3, { align: 'right' }); }
    doc.setLineWidth(0.2); doc.line(L, y + 21.5, R, y + 21.5);

    // Zeile 4: Anzahl
    let r4 = y + 26;
    doc.setFontSize(8.5);
    doc.text('Anzahl Schüler:innen :    1', L, r4);
    doc.text('Anzahl Nutzungseinheiten', boxX(5) + BOX_W - 16, r4, { align: 'right' });
    doc.setLineWidth(0.25); doc.rect(R - 11, y + 22.7, 11, 4.5);
    doc.setFont('helvetica', 'bold');
    doc.text(String(nutzung), R - 5.5, r4, { align: 'center' });
    doc.setFont('helvetica', 'normal');
    doc.setLineWidth(0.5); doc.line(L, y + 28.5, R, y + 28.5);
    y += BLOCK_H;
  });

  if(sorted.length === 0) {
    doc.setFontSize(10); doc.text('Keine Schüler erfasst.', L, y + 10);
  }
  footer();
  return { doc, name: 'Anwesenheitsliste-' + zeitraum + '.pdf', summary };
}

function renderListe() {
  const hint = document.getElementById('listeHint');
  if(!window.jspdf) { hint.textContent = 'PDF-Bibliothek konnte nicht geladen werden (Internetverbindung?).'; return; }
  const { doc, summary } = buildListePdf();
  if(listeUrl) URL.revokeObjectURL(listeUrl);
  listeUrl = doc.output('bloburl');
  document.getElementById('listePreview').src = listeUrl;
  const termine = summary.reduce((a, x) => a + x.termine, 0);
  hint.textContent = students.length + ' Schüler · ' + termine + ' erfasste Termine im gewählten Monat';
}
function openListePdf() {
  if(!window.jspdf) return renderListe();
  const { doc } = buildListePdf();
  window.open(doc.output('bloburl'), '_blank');
}
function downloadListePdf() {
  if(!window.jspdf) return renderListe();
  const { doc, name } = buildListePdf();
  doc.save(name);
}

// ==================== UTILS ====================
function formatEuro(v) {
  return new Intl.NumberFormat('de-DE', {style:'currency', currency:'EUR'}).format(v || 0);
}

function openModal(id) {
  document.getElementById(id).classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// Close modal on overlay click
document.getElementById('studentModal').addEventListener('click', function(e) {
  if(e.target === this) closeModal('studentModal');
});

// ==================== INIT ====================
initBillingPickers();
initListePickers();
renderStudents();
renderAttendance();
</script>
